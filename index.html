<title>跑一單🚗</title>
<style>
:root{
  --bg:#12100B; --surface:#1D1A13; --surface2:#272319; --line:#3A3223;
  --amber:#FFC24D; --amber-soft:#5A4517; --cream:#F6F0E2; --muted:#9A8F79;
  --red:#FF6F5E; --green:#7BD389;
  --meter:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:17px; line-height:1.5;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* ── header ── */
header{
  position:sticky; top:0; z-index:20; background:rgba(18,16,11,.94);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
}
.h-date{font-size:22px; font-weight:800; letter-spacing:.5px}
.h-sub{font-size:13px; color:var(--muted); margin-top:2px}
.h-sub b{color:var(--amber)}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--surface2);
  display:grid;place-items:center;font-size:19px;flex:none}

/* ── next trip (signature meter) ── */
.meter{margin:16px 14px 0; border-radius:20px; overflow:hidden;
  background:linear-gradient(160deg,#221E15,#1A1710); border:1px solid var(--line)}
.meter-top{display:flex;align-items:center;gap:8px;padding:14px 18px 0;
  font-size:12px;letter-spacing:3px;color:var(--amber);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.meter.soon .dot{background:var(--red);animation:blink 1.1s infinite}
.meter.soon .meter-top{color:var(--red)}
@keyframes blink{50%{opacity:.15}}
.meter-count{font-family:var(--meter); font-size:52px; font-weight:700;
  letter-spacing:-1px; font-variant-numeric:tabular-nums;
  padding:2px 18px 0; color:var(--amber); line-height:1.15}
.meter.soon .meter-count{color:var(--red)}
.meter-route{padding:6px 18px 0; font-size:20px; font-weight:700}
.meter-when{padding:4px 18px 16px; color:var(--muted); font-size:14px}
.meter-acts{display:flex; border-top:1px solid var(--line)}
.meter-acts button{flex:1; padding:15px 4px; font-size:15px; font-weight:600;
  border-right:1px solid var(--line)}
.meter-acts button:last-child{border-right:0}
.empty-meter{margin:16px 14px 0;padding:28px 20px;border-radius:20px;
  background:var(--surface);border:1px dashed var(--line);text-align:center;color:var(--muted)}

/* ── tabs ── */
.tabs{display:flex; gap:8px; padding:22px 14px 10px; overflow-x:auto}
.tab{padding:9px 16px;border-radius:999px;background:var(--surface2);
  color:var(--muted);font-size:15px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--amber);color:#17140E}

/* ── cards ── */
.list{padding:0 14px}
.daygroup{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:2px;
  padding:16px 4px 8px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px;
  padding:14px 16px; margin-bottom:12px}
.card.late{border-color:#6d2f27; background:#221410}
.card.done{opacity:.5}
.c-row1{display:flex;align-items:baseline;gap:10px}
.c-time{font-family:var(--meter);font-size:26px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.c-left{font-size:13px;color:var(--amber);font-weight:600}
.card.late .c-left{color:var(--red)}
.c-tag{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);
  padding:3px 9px;border-radius:999px}
.c-route{font-size:17px;font-weight:700;margin-top:6px;line-height:1.45}
.c-route .arw{color:var(--muted);font-weight:400;margin:0 6px}
.c-meta{font-size:14px;color:var(--muted);margin-top:4px}
.c-meta .fare{color:var(--cream);font-family:var(--meter);font-weight:700}
.c-note{font-size:14px;color:var(--cream);background:var(--surface2);
  border-radius:10px;padding:8px 11px;margin-top:9px}
.c-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{padding:9px 13px;border-radius:11px;background:var(--surface2);
  font-size:14px;font-weight:600}
.chip.pri{background:var(--amber);color:#17140E}
.chip.ok{background:#1F3527;color:var(--green)}
.chip.mut{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}

/* ── 記帳 ── */
.money-hero{background:linear-gradient(160deg,#221E15,#1A1710);border:1px solid var(--line);
  border-radius:20px;padding:18px 18px 20px;margin-bottom:14px}
.mh-label{font-size:12px;letter-spacing:3px;color:var(--amber);font-weight:700}
.mh-net{font-family:var(--meter);font-size:46px;font-weight:700;letter-spacing:-1px;
  font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.mh-split{display:flex;gap:20px;margin-top:8px;font-size:14px;color:var(--muted)}
.mh-split b{font-family:var(--meter);color:var(--cream);font-weight:700}
.mh-split .out b{color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:7px;height:92px;margin-top:18px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar i{display:block;background:var(--amber-soft);border-radius:5px 5px 0 0;min-height:3px}
.bar.now i{background:var(--amber)}
.bar span{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
.mcards{display:flex;gap:10px;margin-bottom:14px}
.mcard{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.mcard small{display:block;font-size:12px;color:var(--muted);letter-spacing:1px}
.mcard b{font-family:var(--meter);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.mbtns{display:flex;gap:10px;margin-bottom:6px}
.mbtns button{flex:1;padding:15px 6px;border-radius:15px;font-size:15px;font-weight:800}
.mbtns .meterbtn{background:var(--surface2);color:var(--amber);border:1px solid var(--amber-soft)}
.fare-out{background:linear-gradient(160deg,#221E15,#1A1710);border:1px solid var(--amber-soft);
  border-radius:18px;padding:16px 18px;margin-top:18px;text-align:center}
.fare-out .n{font-family:var(--meter);font-size:44px;font-weight:700;color:var(--amber);
  font-variant-numeric:tabular-nums;line-height:1.2}
.fare-out .d{font-size:13px;color:var(--muted);margin-top:6px}
.togs{display:flex;gap:8px;margin-top:10px}
.togs button{flex:1;padding:12px 6px;border-radius:12px;background:var(--surface2);
  font-size:14px;font-weight:600;border:1px solid var(--line);color:var(--muted)}
.togs button.on{background:var(--amber);color:#17140E;border-color:var(--amber)}
.rate-grid{display:flex;gap:10px}.rate-grid>div{flex:1}
.mbtns .in{background:var(--amber);color:#17140E;flex:1.5;font-size:17px}
.mbtns .out{background:var(--surface2);color:var(--red);border:1px solid #4a2a24}
.led{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px}
.led .t{font-family:var(--meter);font-size:14px;color:var(--muted);flex:none}
.led .c{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led .c em{font-style:normal;color:var(--muted);font-size:13px}
.led .a{font-family:var(--meter);font-size:19px;font-weight:700;flex:none}
.led .a.in{color:var(--amber)}
.led .a.out{color:var(--red)}
.led .x{color:var(--muted);font-size:16px;padding:2px 4px;flex:none}
.amt{font-family:var(--meter);font-size:34px!important;font-weight:700;text-align:center;
  letter-spacing:1px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cats button{padding:11px 16px;border-radius:12px;background:var(--surface2);
  font-size:15px;font-weight:600;border:1px solid var(--line)}
.cats button.on{background:var(--amber);color:#17140E;border-color:var(--amber)}

/* ── FAB ── */
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));
  height:58px;padding:0 24px;border-radius:29px;background:var(--amber);color:#17140E;
  font-size:18px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:30;
  display:flex;align-items:center;gap:8px}

/* ── sheet ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
  max-height:92vh;overflow-y:auto;
  padding:8px 16px calc(90px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.s-title{font-size:20px;font-weight:800;padding:0 2px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.s-close{width:38px;height:38px;border-radius:50%;background:var(--surface2);
  font-size:17px;color:var(--muted);flex:none;display:grid;place-items:center}
.flash{animation:fl .6s ease}
@keyframes fl{0%,100%{background:var(--surface2)}40%{background:#4A3A16}}
label{display:block;font-size:13px;color:var(--muted);font-weight:600;
  margin:14px 2px 6px;letter-spacing:.5px}
input,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);
  border-radius:13px;padding:13px 14px;font-size:17px}
input:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:-2px}
textarea{min-height:70px;resize:vertical}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.quick button{padding:8px 13px;border-radius:10px;background:var(--surface2);
  font-size:14px;color:var(--amber);font-weight:600;border:1px solid var(--amber-soft)}
.two{display:flex;gap:10px}.two>div{flex:1}
.save{width:100%;margin-top:22px;padding:16px;border-radius:15px;background:var(--amber);
  color:#17140E;font-size:18px;font-weight:800}
.del{width:100%;margin-top:10px;padding:14px;border-radius:15px;
  background:transparent;color:var(--red);font-size:15px;font-weight:600}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:15px 2px;border-bottom:1px solid var(--line)}
.setrow small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
.setrow button{padding:9px 14px;border-radius:11px;background:var(--surface2);
  font-size:14px;font-weight:600;flex:none;color:var(--amber)}

/* ── toast ── */
.toast{position:fixed;left:14px;right:14px;bottom:calc(146px + env(safe-area-inset-bottom));
  background:#2E2818;border:1px solid var(--amber-soft);border-radius:15px;
  padding:14px 16px;z-index:60;display:none;align-items:center;gap:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.on{display:flex}
.toast span{flex:1;font-size:15px}
.toast button{background:var(--amber);color:#17140E;padding:9px 14px;
  border-radius:11px;font-weight:700;font-size:14px;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ───────── 資料層（localStorage，失敗時退回記憶體）───────── */
var KEY='taxi_bookings_v1', mem=[], memOnly=false;
function load(){
  if(memOnly) return mem;
  try{ mem=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ memOnly=true; }
  return mem;
}
function save(a){
  mem=a;
  try{ localStorage.setItem(KEY,JSON.stringify(a)); }catch(e){ memOnly=true; }
  if(typeof markDirty==='function') markDirty();
}

var LKEY='taxi_ledger_v1', lmem=[];
function loadL(){
  if(memOnly) return lmem;
  try{ lmem=JSON.parse(localStorage.getItem(LKEY)||'[]'); }catch(e){ memOnly=true; }
  return lmem;
}
function saveL(a){
  lmem=a;
  try{ localStorage.setItem(LKEY,JSON.stringify(a)); }catch(e){ memOnly=true; }
  if(typeof markDirty==='function') markDirty();
}

/* ───────── 工具 ───────── */
var WD=['日','一','二','三','四','五','六'];
function pad(n){return n<10?'0'+n:''+n}
function toLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function parseT(s){var p=s.split(/[-T:]/);return new Date(+p[0],+p[1]-1,+p[2],+p[3],+p[4])}
function dayKey(s){return s.slice(0,10)}
function todayKey(){return toLocal(new Date()).slice(0,10)}
function fmtDay(k){
  var p=k.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
  var t=todayKey(), tm=toLocal(new Date(Date.now()+864e5)).slice(0,10);
  var label = k===t?'今天':(k===tm?'明天':'');
  return (+p[1])+'月'+(+p[2])+'日 週'+WD[d.getDay()]+(label?' · '+label:'');
}
function left(ms){
  var m=Math.round(ms/60000);
  if(m<0){var a=-m; return a<60?('已過 '+a+' 分'):('已過 '+Math.floor(a/60)+' 小時');}
  if(m<60) return '剩 '+m+' 分';
  var h=Math.floor(m/60), mm=m%60;
  if(h<24) return '剩 '+h+' 小時'+(mm?' '+mm+' 分':'');
  return '剩 '+Math.floor(h/24)+' 天';
}
function bigCount(ms){
  if(ms<0) return '已過時間';
  var s=Math.floor(ms/1000), d=Math.floor(s/86400);
  if(d>=1) return d+' 天 '+Math.floor(s%86400/3600)+' 小時';
  return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
}
function nt(n){return (n<0?'-':'')+'$'+Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function weekStart(){var d=new Date();var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);d.setHours(0,0,0,0);return toLocal(d).slice(0,10)}
function monthStart(){var d=new Date();return toLocal(d).slice(0,7)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ───────── 畫面 ───────── */
var tab='today', editId=null;

function render(){
  var all=load().slice().sort(function(a,b){return a.time<b.time?-1:1});
  var now=new Date(), nowS=toLocal(now);

  var d=new Date();
  document.getElementById('hDate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 週'+WD[d.getDay()];
  var todo=all.filter(function(b){return b.status==='pending'&&dayKey(b.time)===todayKey()});
  var tIn=loadL().filter(function(x){return dayKey(x.time)===todayKey()&&x.kind==='in'})
                 .reduce(function(a,b){return a+b.amount},0);
  document.getElementById('hSub').innerHTML=
    (todo.length? ('今天還有 <b>'+todo.length+'</b> 趟') : '今天沒有預約')
    + (tIn? ' · 已收 <b>'+nt(tIn)+'</b>' : '');

  /* 下一趟 */
  var next=all.filter(function(b){return b.status==='pending'&&b.time>=nowS})[0];
  var mw=document.getElementById('meterWrap');
  if(next){
    var ms=parseT(next.time)-now, soon=ms<30*60000;
    mw.innerHTML=
     '<div class="meter'+(soon?' soon':'')+'">'
     +'<div class="meter-top"><i class="dot"></i>下一趟</div>'
     +'<div class="meter-count" id="bigC">'+bigCount(ms)+'</div>'
     +'<div class="meter-route">'+esc(next.from||'—')+'<span style="color:var(--muted)"> → </span>'+esc(next.to||'—')+'</div>'
     +'<div class="meter-when">'+fmtDay(dayKey(next.time))+' '+next.time.slice(11)+(next.name?' · '+esc(next.name):'')+'</div>'
     +'<div class="meter-acts">'
       +(next.phone?'<button onclick="call(\''+next.phone+'\')">📞 撥號</button>':'')
       +'<button onclick="nav('+q(next.to)+')">🧭 導航</button>'
       +'<button onclick="done(\''+next.id+'\')">✓ 完成</button>'
     +'</div></div>';
  } else {
    mw.innerHTML='<div class="empty-meter">目前沒有待跑的預約<br><span style="font-size:14px">按右下角新增</span></div>';
  }

  if(tab==='money'){ mw.innerHTML=''; renderMoney(); return; }

  /* 清單 */
  var items;
  if(tab==='done') items=all.filter(function(b){return b.status!=='pending'}).reverse();
  else if(tab==='today') items=all.filter(function(b){return b.status==='pending'&&dayKey(b.time)<=todayKey()});
  else items=all.filter(function(b){return b.status==='pending'&&dayKey(b.time)>todayKey()});

  var html='', lastDay='';
  items.forEach(function(b){
    var k=dayKey(b.time);
    if(k!==lastDay){ html+='<div class="daygroup">'+fmtDay(k)+'</div>'; lastDay=k; }
    var late=b.status==='pending'&&b.time<nowS;
    html+='<div class="card'+(late?' late':'')+(b.status!=='pending'?' done':'')+'">'
      +'<div class="c-row1"><div class="c-time">'+b.time.slice(11)+'</div>'
      +'<div class="c-left">'+(b.status==='pending'?left(parseT(b.time)-now):(b.status==='done'?'已完成':'已取消'))+'</div>'
      +(b.fare?'<div class="c-tag">$'+esc(b.fare)+'</div>':'')+'</div>'
      +'<div class="c-route">'+esc(b.from||'—')+'<span class="arw">→</span>'+esc(b.to||'—')+'</div>'
      +((b.name||b.phone)?'<div class="c-meta">'+esc(b.name||'')+(b.phone?' · '+esc(b.phone):'')+'</div>':'')
      +(b.note?'<div class="c-note">'+esc(b.note)+'</div>':'')
      +'<div class="c-acts">'
        +(b.status==='pending'
          ? (b.phone?'<button class="chip" onclick="call(\''+b.phone+'\')">📞 撥號</button>':'')
            +'<button class="chip" onclick="nav('+q(b.to)+')">🧭 導航</button>'
            +'<button class="chip" onclick="ics(\''+b.id+'\')">🔔 加行事曆</button>'
            +'<button class="chip pri" onclick="done(\''+b.id+'\')">✓ 完成</button>'
            +'<button class="chip mut" onclick="openForm(\''+b.id+'\')">修改</button>'
          : '<button class="chip ok" onclick="again(\''+b.id+'\')">↻ 再訂一次</button>'
            +'<button class="chip mut" onclick="openForm(\''+b.id+'\')">查看</button>')
      +'</div></div>';
  });
  document.getElementById('list').innerHTML = html ||
    '<div class="empty">'+(tab==='done'?'還沒有完成紀錄':'這裡沒有預約')+'</div>';
}
function q(s){return esc(JSON.stringify(s||''))}

function renderMoney(){
  var L=loadL(), t=todayKey(), ws=weekStart(), ms=monthStart();
  function sum(f,k){return L.filter(function(x){return f(x)&&x.kind===k})
    .reduce(function(a,b){return a+b.amount},0)}
  var isT=function(x){return dayKey(x.time)===t},
      isW=function(x){return dayKey(x.time)>=ws},
      isM=function(x){return x.time.slice(0,7)===ms};
  var tin=sum(isT,'in'), tout=sum(isT,'out');

  /* 近 7 天 */
  var days=[], max=1;
  for(var i=6;i>=0;i--){
    var d=new Date(); d.setDate(d.getDate()-i);
    var k=toLocal(d).slice(0,10);
    var n=L.filter(function(x){return dayKey(x.time)===k&&x.kind==='in'})
           .reduce(function(a,b){return a+b.amount},0);
    if(n>max) max=n;
    days.push({k:k,n:n,lb:WD[d.getDay()],now:i===0});
  }
  var bars=days.map(function(d){
    return '<div class="bar'+(d.now?' now':'')+'"><i style="height:'
      +Math.max(3,Math.round(d.n/max*88))+'px"></i><span>'+d.lb+'</span></div>';
  }).join('');

  var today=L.filter(isT).sort(function(a,b){return a.time<b.time?1:-1});
  var rows=today.map(function(x){
    return '<div class="led"><div class="t">'+x.time.slice(11)+'</div>'
      +'<div class="c">'+esc(x.cat)+(x.note?' <em>'+esc(x.note)+'</em>':'')+'</div>'
      +'<div class="a '+x.kind+'">'+(x.kind==='in'?'+':'−')+nt(x.amount).slice(1)+'</div>'
      +'<button class="x" onclick="delLed(\''+x.id+'\')">✕</button></div>';
  }).join('');

  document.getElementById('list').innerHTML=
    '<div class="money-hero"><div class="mh-label">今日淨收入</div>'
    +'<div class="mh-net" style="color:'+(tin-tout>=0?'var(--amber)':'var(--red)')+'">'
      +nt(tin-tout)+'</div>'
    +'<div class="mh-split"><div>收入 <b>'+nt(tin)+'</b></div>'
      +'<div class="out">支出 <b>'+nt(tout)+'</b></div></div>'
    +'<div class="bars">'+bars+'</div></div>'
    +'<div class="mcards">'
      +'<div class="mcard"><small>本週</small><b>'+nt(sum(isW,'in')-sum(isW,'out'))+'</b></div>'
      +'<div class="mcard"><small>本月</small><b>'+nt(sum(isM,'in')-sum(isM,'out'))+'</b></div>'
    +'</div>'
    +'<div class="mbtns"><button class="in" onclick="openLed(\'in\')">＋ 收入</button>'
      +'<button class="out" onclick="openLed(\'out\')">－ 支出</button>'
      +'<button class="meterbtn" onclick="openFare()">跳表試算</button></div>'
    +'<div class="daygroup">今天明細</div>'
    +(rows||'<div class="empty">今天還沒有紀錄</div>');
}

/* ───────── 雲端同步 ───────── */
var dirty=false, syncing=false;
function syncUrl(){try{return localStorage.getItem('sync_url')||''}catch(e){return ''}}
function lastSync(){try{return localStorage.getItem('sync_at')||''}catch(e){return ''}}
function markDirty(){ if(syncUrl()){ dirty=true; clearTimeout(window._sy);
  window._sy=setTimeout(function(){push(true)},1500); } }

function push(quiet){
  var u=syncUrl(); if(!u||syncing) return;
  syncing=true;
  fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({bookings:load(),ledger:loadL()})})
  .then(function(r){return r.json()})
  .then(function(d){
    syncing=false;
    if(d&&d.ok){ dirty=false;
      try{localStorage.setItem('sync_at',toLocal(new Date()))}catch(e){}
      if(!quiet) toast('已上傳到雲端');
      showSync();
    } else if(!quiet) toast('上傳失敗，請檢查網址');
  })
  .catch(function(){ syncing=false; if(!quiet) toast('連不上雲端，等有網路會自動重試'); });
}
function pull(auto){
  var u=syncUrl(); if(!u) return;
  fetch(u).then(function(r){return r.json()}).then(function(d){
    if(!d||!d.ok){ if(!auto) toast('取回失敗'); return; }
    var bk=d.bookings||[], lg=d.ledger||[];
    if(!auto && !confirm('取回雲端資料會覆蓋這台手機目前的內容，確定？')) return;
    bk.forEach(function(b){ b.notified=b.notified||{} });
    save(bk); saveL(lg);
    try{localStorage.setItem('sync_at',toLocal(new Date()))}catch(e){}
    render(); showSync();
    toast('已取回 '+(bk.length+lg.length)+' 筆');
  }).catch(function(){ if(!auto) toast('連不上雲端'); });
}
function pushNow(){ if(!syncUrl()){toast('請先存網址');return;} toast('上傳中…'); push(false); }
function pullNow(){ if(!syncUrl()){toast('請先存網址');return;} pull(false); }
function openSync(){
  val('s-url',syncUrl());
  document.getElementById('syncInfo').innerHTML=
    syncUrl()? ('上次同步：'+(lastSync()||'尚未同步')) :
    '設定後，每次新增或修改都會自動存到你的 Google 試算表。';
  show(document.getElementById('sheetSync'));
}
function saveSync(){
  var u=g('s-url').trim();
  if(u && u.indexOf('https://script.google.com/')!==0){ toast('網址看起來不對'); return; }
  try{localStorage.setItem('sync_url',u)}catch(e){}
  closeSheets(); showSync();
  if(u){ toast('已啟用，正在上傳…'); push(false); } else toast('已停用同步');
}
function clearSync(){
  if(!confirm('停用雲端同步？手機上的資料不會被刪除。'))return;
  try{localStorage.removeItem('sync_url')}catch(e){}
  closeSheets(); showSync(); toast('已停用同步');
}
function showSync(){
  var el=document.getElementById('syncTxt'); if(!el)return;
  el.textContent = syncUrl() ? ('上次同步：'+(lastSync()||'尚未同步')) : '尚未設定';
}
function syncBoot(){
  if(!syncUrl()) return;
  if(!load().length && !loadL().length) pull(true);   // 這台手機是空的 → 自動取回
  else if(dirty) push(true);
}
setInterval(function(){ if(dirty) push(true); },60000);

/* ───────── 跳表試算 ───────── */
var DEF={basekm:1.25,base:85,unitm:200,unitfee:5,waits:100,waitfee:5,night:20,extra:50};
function rate(){
  try{ return Object.assign({},DEF,JSON.parse(localStorage.getItem('taxi_rate_v1')||'{}')); }
  catch(e){ return Object.assign({},DEF); }
}
var fareTog={night:false,extra:false};
function openFare(){
  var h=new Date().getHours();
  fareTog={night:(h>=23||h<6),extra:false};
  val('k-km',''); val('k-wait','');
  drawTog(); calcFare();
  show(document.getElementById('sheetFare'));
}
function tog(k){fareTog[k]=!fareTog[k];drawTog();calcFare()}
function drawTog(){
  document.getElementById('k-night').className=fareTog.night?'on':'';
  document.getElementById('k-extra').className=fareTog.extra?'on':'';
}
function num(id){var v=parseFloat(g(id).replace(/[^0-9.]/g,''));return isNaN(v)?0:v}
function calcFare(){
  var r=rate(), km=num('k-km'), wait=num('k-wait')*60;
  var run=r.base;
  if(km>r.basekm) run+=Math.ceil((km-r.basekm)*1000/r.unitm)*r.unitfee;
  var dly=Math.floor(wait/r.waits)*r.waitfee;
  var sub=run+dly, total=sub;
  if(fareTog.night) total=sub*(1+r.night/100);
  total=Math.round(total/5)*5;
  if(fareTog.extra) total+=r.extra;
  var d=[km?km+' 公里':'', dly?('延滯 '+dly+' 元'):'',
         fareTog.night?('夜間 +'+r.night+'%'):'', fareTog.extra?('加成 +'+r.extra):''].filter(Boolean);
  document.getElementById('k-out').textContent=nt(km?total:0);
  document.getElementById('k-desc').textContent=d.length?d.join('　'):'輸入里程';
  return km?total:0;
}
function fareToLedger(){
  var t=calcFare();
  if(!t){toast('請先輸入里程');return;}
  closeSheets();
  openLed('in',String(t),'跳表');
}
function openRate(){
  var r=rate();
  val('r-basekm',r.basekm); val('r-base',r.base);
  val('r-unitm',r.unitm);   val('r-unitfee',r.unitfee);
  val('r-waits',r.waits);   val('r-waitfee',r.waitfee);
  val('r-night',r.night);   val('r-extra',r.extra);
  show(document.getElementById('sheetRate'));
}
function saveRate(){
  var r={basekm:num('r-basekm')||DEF.basekm, base:num('r-base')||DEF.base,
         unitm:num('r-unitm')||DEF.unitm,   unitfee:num('r-unitfee')||DEF.unitfee,
         waits:num('r-waits')||DEF.waits,   waitfee:num('r-waitfee')||DEF.waitfee,
         night:num('r-night'),              extra:num('r-extra')};
  try{localStorage.setItem('taxi_rate_v1',JSON.stringify(r))}catch(e){}
  closeSheets(); toast('費率已更新');
}

/* ───────── 記帳 ───────── */
var CAT={in:['跳表','預約','小費','其他'],out:['加油','停車','洗車','修車','其他']};
var ledKind='in', ledCat='跳表';
function openLed(kind,amt,cat,d){
  ledKind=kind; ledCat=cat||CAT[kind][0];
  document.getElementById('ledTitle').textContent=kind==='in'?'記一筆收入':'記一筆支出';
  val('l-amt',amt||''); val('l-note','');
  val('l-date',d||todayKey());
  drawCats();
  show(document.getElementById('sheetLed'));
  var a=document.getElementById('l-amt');
  try{ a.focus(); a.click(); }catch(e){}
}
function drawCats(){
  document.getElementById('l-cats').innerHTML=CAT[ledKind].map(function(c){
    return '<button class="'+(c===ledCat?'on':'')+'" onclick="pickCat('+q(c)+')">'+esc(c)+'</button>';
  }).join('');
}
function pickCat(c){ledCat=c;drawCats()}
function saveLed(){
  var n=parseInt(g('l-amt').replace(/[^0-9]/g,''),10);
  if(!n||n<=0){toast('請輸入金額');return;}
  var d=g('l-date')||todayKey();
  var now=new Date(), hm=(d===todayKey())?toLocal(now).slice(11):'12:00';
  var L=loadL();
  L.push({id:'l'+Date.now(),time:d+'T'+hm,amount:n,kind:ledKind,cat:ledCat,note:g('l-note')});
  saveL(L); closeSheets(); render();
  toast((ledKind==='in'?'收入 +':'支出 −')+n+' 已記下');
}
function delLed(id){
  if(!confirm('刪除這筆紀錄？'))return;
  saveL(loadL().filter(function(x){return x.id!==id})); render();
}
function csv(){
  var L=loadL().slice().sort(function(a,b){return a.time<b.time?-1:1});
  if(!L.length){toast('還沒有任何紀錄');return;}
  var rows=[['日期','時間','收支','類別','金額','備註']].concat(L.map(function(x){
    return [x.time.slice(0,10),x.time.slice(11),x.kind==='in'?'收入':'支出',x.cat,x.amount,(x.note||'')];
  }));
  var t='\ufeff'+rows.map(function(r){
    return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',');
  }).join('\r\n');
  dl(new Blob([t],{type:'text/csv;charset=utf-8'}),'收支明細_'+todayKey()+'.csv');
  toast('已匯出 '+L.length+' 筆');
}

/* 每秒更新倒數 */
setInterval(function(){
  var el=document.getElementById('bigC');
  if(!el) return;
  var all=load().filter(function(b){return b.status==='pending'&&b.time>=toLocal(new Date())})
                .sort(function(a,b){return a.time<b.time?-1:1});
  if(!all[0]){render();return;}
  var ms=parseT(all[0].time)-new Date();
  el.textContent=bigCount(ms);
  var m=el.closest('.meter');
  if(ms<30*60000) m.classList.add('soon'); else m.classList.remove('soon');
  checkNoti();
},1000);

/* ───────── 動作 ───────── */
function call(p){location.href='tel:'+p.replace(/[^0-9+]/g,'')}
function nav(t){ if(!t){toast('這筆沒有填目的地');return;}
  window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(t),'_blank'); }
var payId=null;
function done(id){
  var b=load().filter(function(x){return x.id===id})[0]; if(!b)return;
  payId=id;
  document.getElementById('payWho').textContent=
    (b.from||'')+(b.to?' → '+b.to:'')+(b.name?'（'+b.name+'）':'');
  val('p-amt', b.fare||'');
  show(document.getElementById('sheetPay'));
  var e=document.getElementById('p-amt');
  try{ e.focus(); e.click(); }catch(err){}
}
function payDone(skip){
  var a=load(); a.forEach(function(b){if(b.id===payId)b.status='done'}); save(a);
  if(!skip){
    var n=parseInt(g('p-amt').replace(/[^0-9]/g,''),10);
    if(n>0){
      var L=loadL();
      L.push({id:'l'+Date.now(),time:toLocal(new Date()),amount:n,kind:'in',
              cat:'預約',note:document.getElementById('payWho').textContent.slice(0,40)});
      saveL(L);
      closeSheets(); payId=null; render(); toast('完成，收入 +'+n);
      return;
    }
  }
  closeSheets(); payId=null; render(); toast('已標記完成');
}
function again(id){
  var b=load().filter(function(x){return x.id===id})[0]; if(!b)return;
  openForm(null,{from:b.from,to:b.to,name:b.name,phone:b.phone,fare:b.fare,note:b.note});
}

/* ───────── 表單 ───────── */
function openForm(id,pre){
  editId=id||null;
  var f=document.getElementById('sheetForm');
  document.getElementById('fTitle').textContent=id?'修改預約':'新增預約';
  document.getElementById('fDel').style.display=id?'block':'none';
  var b = id ? load().filter(function(x){return x.id===id})[0] : (pre||{});
  var t=new Date(Date.now()+3600000); t.setMinutes(Math.ceil(t.getMinutes()/10)*10,0,0);
  val('f-time', b.time||toLocal(t));
  val('f-from',b.from||''); val('f-to',b.to||''); val('f-name',b.name||'');
  val('f-phone',b.phone||''); val('f-fare',b.fare||''); val('f-note',b.note||'');
  show(f);
}
function val(id,v){document.getElementById(id).value=v}
function g(id){return document.getElementById(id).value.trim()}
function setT(t){
  val('f-time',toLocal(t));
  var el=document.getElementById('f-time');
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  toast('上車時間：'+(t.getMonth()+1)+'/'+t.getDate()+' '+pad(t.getHours())+':'+pad(t.getMinutes()));
}
function qt(min){var t=new Date(Date.now()+min*60000);t.setSeconds(0,0);setT(t)}
function qtm(dayOffset,hour){
  var t=new Date(); t.setDate(t.getDate()+dayOffset); t.setHours(hour,0,0,0); setT(t);
}
function saveBooking(){
  var time=g('f-time');
  if(!time){toast('請先選上車時間');return;}
  if(!g('f-from')&&!g('f-to')){toast('至少填上車地點或目的地');return;}
  var a=load();
  var rec={id:editId||('b'+Date.now()), time:time.slice(0,16),
    from:g('f-from'), to:g('f-to'), name:g('f-name'), phone:g('f-phone'),
    fare:g('f-fare'), note:g('f-note'), notified:{}};
  if(editId){ a=a.map(function(x){return x.id===editId?Object.assign(x,rec):x}); }
  else { rec.status='pending'; a.push(rec); }
  save(a); closeSheets();
  tab = dayKey(rec.time)>todayKey() ? 'later' : 'today';
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.tab===tab)});
  render();
  toast('已存檔 · 建議也加進行事曆','加入行事曆',function(){ics(rec.id)});
}
function deleteBooking(){
  if(!editId)return;
  if(!confirm('確定刪除這筆預約？'))return;
  save(load().filter(function(x){return x.id!==editId}));
  closeSheets(); render(); toast('已刪除');
}

/* ───────── 行事曆 .ics ───────── */
function icsEsc(s){return (s||'').replace(/\\/g,'\\\\').replace(/([,;])/g,'\\$1').replace(/\n/g,'\\n')}
function stamp(d){return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z'}
function vevent(b){
  var dt=b.time.replace(/[-:]/g,'')+'00';
  var title='🚕 '+(b.from||'')+(b.to?' → '+b.to:'')+(b.name?'（'+b.name+'）':'');
  var desc=[b.name?'客人：'+b.name:'', b.phone?'電話：'+b.phone:'',
            b.fare?'車資：'+b.fare:'', b.note?'備註：'+b.note:''].filter(Boolean).join('\n');
  return ['BEGIN:VEVENT','UID:'+b.id+'@taxi.local','DTSTAMP:'+stamp(new Date()),
    'DTSTART:'+dt,'DURATION:PT40M','SUMMARY:'+icsEsc(title),
    'LOCATION:'+icsEsc(b.from||''),'DESCRIPTION:'+icsEsc(desc),
    'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('30分鐘後有預約：'+title),'END:VALARM',
    'BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('10分鐘後有預約：'+title),'END:VALARM',
    'END:VEVENT'].join('\r\n');
}
function icsFile(list,name){
  var s=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//taxi-booking//TW','CALSCALE:GREGORIAN']
    .concat(list.map(vevent)).concat(['END:VCALENDAR']).join('\r\n');
  dl(new Blob([s],{type:'text/calendar;charset=utf-8'}), name);
}
function calMode(){try{return localStorage.getItem('cal_mode')||'ics'}catch(e){return 'ics'}}
function toggleCal(){
  var m=calMode()==='ics'?'gcal':'ics';
  try{localStorage.setItem('cal_mode',m)}catch(e){}
  document.getElementById('calModeTxt').textContent='目前：'+(m==='ics'?'手機行事曆':'Google 日曆');
  toast('提醒改加到 '+(m==='ics'?'手機行事曆':'Google 日曆'));
}
function utc(s){var d=parseT(s);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'}
function gcal(b){
  var end=new Date(parseT(b.time).getTime()+40*60000);
  var t='🚕 '+(b.from||'')+(b.to?' → '+b.to:'')+(b.name?'（'+b.name+'）':'');
  var d=[b.name?'客人：'+b.name:'',b.phone?'電話：'+b.phone:'',b.fare?'車資：'+b.fare:'',b.note?'備註：'+b.note:''].filter(Boolean).join('\n');
  var u='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(t)
    +'&dates='+utc(b.time)+'/'+utc(toLocal(end))
    +'&details='+encodeURIComponent(d)
    +'&location='+encodeURIComponent(b.from||'')
    +'&ctz=Asia/Taipei';
  window.open(u,'_blank');
}
function ics(id){
  var b=load().filter(function(x){return x.id===id})[0]; if(!b)return;
  if(calMode()==='gcal'){ gcal(b); toast('在 Google 日曆按「儲存」即可'); return; }
  icsFile([b],'預約_'+b.time.replace(/[-:T]/g,'')+'.ics');
  toast('點開下載的檔案，再按「加入行事曆」');
}
function icsAll(){
  var l=load().filter(function(b){return b.status==='pending'});
  if(!l.length){toast('沒有待跑的預約');return;}
  icsFile(l,'全部預約.ics'); toast('已匯出 '+l.length+' 筆');
}
function dl(blob,name){
  var u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},2000);
}

/* ───────── 備份 ───────── */
function backup(){
  dl(new Blob([JSON.stringify({bookings:load(),ledger:loadL()})],{type:'application/json'}),
     '備份_'+todayKey()+'.json');
  try{localStorage.setItem('last_backup',todayKey())}catch(e){}
  toast('備份已下載，記得存到雲端硬碟');
}
function backupCheck(){
  var last;
  try{ last=localStorage.getItem('last_backup'); }catch(e){ return; }
  if(!load().length && !loadL().length) return;
  var days = last ? Math.round((new Date()-parseT(last+'T00:00'))/864e5) : 99;
  if(days>=7){
    toast(last?('已經 '+days+' 天沒備份了'):'還沒備份過資料','立即備份',backup);
  }
}
function restore(e){
  var f=e.target.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      var bk=Array.isArray(d)?d:(d.bookings||[]), lg=Array.isArray(d)?[]:(d.ledger||[]);
      var cur=load(), ids={}; cur.forEach(function(b){ids[b.id]=1});
      bk.forEach(function(b){ if(!ids[b.id]) cur.push(b) });
      save(cur);
      var cl=loadL(), lid={}; cl.forEach(function(x){lid[x.id]=1});
      lg.forEach(function(x){ if(!lid[x.id]) cl.push(x) });
      saveL(cl);
      render(); closeSheets(); toast('已還原 '+(bk.length+lg.length)+' 筆');
    }catch(err){ toast('這個檔案讀不了，請選備份的 .json'); }
  };
  r.readAsText(f); e.target.value='';
}
function clearOld(){
  var cut=toLocal(new Date(Date.now()-30*864e5));
  var a=load(), n=a.length;
  a=a.filter(function(b){return b.status==='pending'||b.time>cut});
  save(a); render(); toast('清除了 '+(n-a.length)+' 筆');
}

/* ───────── 通知（App 開著時）───────── */
function askNoti(){
  if(!('Notification' in window)){toast('這台手機的瀏覽器不支援，請用行事曆提醒');return;}
  Notification.requestPermission().then(function(p){
    document.getElementById('notiState').textContent =
      p==='granted' ? '已開啟。注意：App 完全關掉時不會響，行事曆才會。' : '未允許，請到手機設定開啟通知';
    toast(p==='granted'?'提醒已開啟':'未開啟通知權限');
  });
}
function checkNoti(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var a=load(), now=Date.now(), changed=false;
  a.forEach(function(b){
    if(b.status!=='pending')return;
    b.notified=b.notified||{};
    var m=(parseT(b.time)-now)/60000;
    [[30,'30'],[10,'10']].forEach(function(x){
      if(m<=x[0]&&m>x[0]-1.2&&!b.notified[x[1]]){
        b.notified[x[1]]=1; changed=true;
        new Notification('還有 '+x[0]+' 分鐘有預約',{body:(b.from||'')+' → '+(b.to||'')+(b.name?'（'+b.name+'）':''),tag:b.id+x[1]});
      }
    });
  });
  if(changed) save(a);
}

/* ───────── UI 小工具 ───────── */
function show(el){document.getElementById('scrim').classList.add('on');el.classList.add('on')}
function closeSheets(){
  document.getElementById('scrim').classList.remove('on');
  document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('on')});
}
function openSettings(){
  showSync();
  var r=rate();
  document.getElementById('rateTxt').textContent=
    '起程 '+r.basekm+'km '+r.base+'元，續程每 '+r.unitm+'m '+r.unitfee+'元';
  document.getElementById('calModeTxt').textContent='目前：'+(calMode()==='ics'?'手機行事曆':'Google 日曆');
  show(document.getElementById('sheetSet'));
}
var tTimer;
function toast(msg,btn,fn){
  var t=document.getElementById('toast'), b=document.getElementById('toastBtn');
  document.getElementById('toastMsg').textContent=msg;
  if(btn){b.style.display='';b.textContent=btn;b.onclick=function(){fn();hideToast()}}
  else b.style.display='none';
  t.classList.add('on'); clearTimeout(tTimer); tTimer=setTimeout(hideToast,btn?7000:2600);
}
function hideToast(){document.getElementById('toast').classList.remove('on')}
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    tab=t.dataset.tab;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
    t.classList.add('on'); render();
  };
});
render();
syncBoot();
setTimeout(function(){ if(!syncUrl()) backupCheck(); },1200);
</script>
